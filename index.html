<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taiha Studio - أداة معالجة الصور الفورية</title>
    
    <!-- PWA settings -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/512/000000/photo-editor.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/000000/photo-editor.png">
    <meta name="theme-color" content="#06b6d4">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, sans-serif; }
        .glass-card { background: rgba(18, 24, 38, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto p-4">

    <!-- Header -->
    <header class="glass-card p-4 rounded-2xl flex items-center justify-between shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-xl bg-cyan-600/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 text-xl font-bold">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <div>
                <h1 class="font-bold text-white text-base">Taiha Studio</h1>
                <p class="text-xs text-cyan-400">معالجة فورية • بدون حفظ بيانات</p>
            </div>
        </div>
        <span class="text-xs bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-2 py-1 rounded-lg">سريع وآمن</span>
    </header>

    <!-- Main Tool Container -->
    <main class="flex-1 my-6 flex flex-col items-center justify-center text-center">
        <div class="glass-card p-6 rounded-3xl w-full space-y-4 border border-dashed border-cyan-500/30">
            <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center text-2xl mx-auto">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <div>
                <h2 class="text-white font-bold text-lg">اختر صورة لمعالجتها</h2>
                <p class="text-xs text-gray-400 mt-1">يتم تعديل الصور فوراً دون تخزينها على أجهزة السيرفر</p>
            </div>

            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
            
            <button onclick="document.getElementById('imageInput').click()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-cyan-500/20">
                رفع صورة
            </button>

            <!-- Preview & Result Area -->
            <div id="previewArea" class="hidden space-y-3 mt-4">
                <img id="imagePreview" class="w-full h-48 object-cover rounded-xl border border-gray-700">
                <button onclick="processImage()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition">
                    <i class="fa-solid fa-bolt ml-1"></i> تطبيق المعالجة الفورية
                </button>
            </div>

            <div id="statusMessage" class="text-xs text-gray-300 hidden"></div>
        </div>
    </main>

    <!-- Footer Note -->
    <footer class="text-center text-xs text-gray-500 pb-2">
        ⚡ جميع العمليات تتم في الجلسة الحالية وتتم إزالتها فوراً.
    </footer>

    <script>
        let selectedFile = null;

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('previewArea').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        async function processImage() {
            const status = document.getElementById('statusMessage');
            status.innerText = "جاري معالجة الصورة بدون تخزين...";
            status.classList.remove('hidden');

            try {
                const res = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: "data" })
                });
                const data = await res.json();
                status.innerText = "✅ " + data.message;
                status.className = "text-xs text-emerald-400 font-bold mt-2";
            } catch (err) {
                status.innerText = "حدث خطأ أثناء المعالجة.";
                status.className = "text-xs text-red-400 font-bold mt-2";
            }
        }
    </script>
</body>
              </html>
