<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taiha Studio | الاستوديو الذكي</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/jpeg" href="https://files.catbox.moe/v5oblu.jpg">
    <link rel="apple-touch-icon" href="https://files.catbox.moe/v5oblu.jpg">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow-btn { background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); transition: 0.3s; }
        .glow-btn:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto p-4">

    <!-- Header -->
    <header class="glass-panel p-4 rounded-2xl flex items-center justify-between mb-4 shadow-lg">
        <div class="flex items-center gap-3">
            <img src="https://files.catbox.moe/v5oblu.jpg" class="w-12 h-12 rounded-xl object-cover ring-2 ring-purple-500/50">
            <div>
                <h1 class="font-black text-white text-base">Taiha Studio</h1>
                <p class="text-xs text-purple-400">معالجة فورية آمنة 100%</p>
            </div>
        </div>
        <div class="w-9 h-9 rounded-xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>
    </header>

    <!-- Main Tool -->
    <main class="flex-1 flex flex-col justify-center">
        <div class="glass-panel p-5 rounded-3xl space-y-4 text-center">
            
            <!-- Upload Box -->
            <div id="uploadContainer" class="border-2 border-dashed border-purple-500/30 hover:border-purple-500/60 rounded-2xl p-6 cursor-pointer bg-slate-900/50 transition" onclick="document.getElementById('imageInput').click()">
                <div class="w-14 h-14 rounded-2xl bg-purple-500/10 text-purple-400 flex items-center justify-center text-xl mx-auto mb-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <h2 class="text-white font-bold text-sm">اختر صورة لمعالجتها</h2>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
            </div>

            <!-- Preview & Controls -->
            <div id="previewArea" class="hidden space-y-3">
                <div class="relative rounded-xl overflow-hidden border border-slate-700 bg-black">
                    <canvas id="imageCanvas" class="w-full h-52 object-contain mx-auto block"></canvas>
                    <button onclick="resetImage()" class="absolute top-2 left-2 bg-red-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Filters -->
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="applyFilter('grayscale')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold py-2 px-2 rounded-xl border border-slate-700 transition">
                        <i class="fa-solid fa-adjust text-purple-400 ml-1"></i> أبيض وأسود
                    </button>
                    <button onclick="applyFilter('bright')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold py-2 px-2 rounded-xl border border-slate-700 transition">
                        <i class="fa-solid fa-sun text-yellow-400 ml-1"></i> تفتيح الصورة
                    </button>
                </div>

                <button onclick="downloadImage()" class="w-full glow-btn text-white font-bold py-3 rounded-xl shadow-lg text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> حفظ وتنزيل الصورة المُعالجَة
                </button>
            </div>

            <div id="statusMessage" class="text-xs font-medium text-emerald-400 hidden"></div>
        </div>
    </main>

    <footer class="text-center text-xs text-slate-500 py-2">
        <span>بدون قواعد بيانات • يعمل مباشرة في جهازك 🔒</span>
    </footer>

    <!-- Script Logic -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log(err));
            });
        }

        let canvas = document.getElementById('imageCanvas');
        let ctx = canvas.getContext('2d');
        let img = new Image();
        let originalImageWidth = 0;
        let originalImageHeight = 0;

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    img.src = e.target.result;
                    img.onload = function() {
                        originalImageWidth = img.width;
                        originalImageHeight = img.height;
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);

                        document.getElementById('uploadContainer').classList.add('hidden');
                        document.getElementById('previewArea').classList.remove('hidden');
                        showStatus("✅ تم تحميل الصورة بنجاح وجاهزة للتعديل!");
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function resetImage() {
            document.getElementById('imageInput').value = "";
            document.getElementById('previewArea').classList.add('hidden');
            document.getElementById('uploadContainer').classList.remove('hidden');
            document.getElementById('statusMessage').classList.add('hidden');
        }

        function applyFilter(type) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                if (type === 'grayscale') {
                    let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    data[i] = avg; data[i + 1] = avg; data[i + 2] = avg;
                } else if (type === 'bright') {
                    data[i] = Math.min(255, data[i] * 1.2);
                    data[i + 1] = Math.min(255, data[i + 1] * 1.2);
                    data[i + 2] = Math.min(255, data[i + 2] * 1.2);
                }
            }
            ctx.putImageData(imgData, 0, 0);
            showStatus("✨ تم تطبيق الفلتر بنجاح!");
        }

        function downloadImage() {
            let link = document.createElement('a');
            link.download = 'taiha-edited.jpg';
            link.href = canvas.toDataURL('image/jpeg');
            link.click();
            showStatus("🚀 تم تنزيل الصورة على جهازك بنجاح!");
        }

            function showStatus(text) {
            let msg = document.getElementById('statusMessage');
            msg.innerText = text;
            msg.classList.remove('hidden');
        }
    </script>
</body>
</html>
