<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taiha Studio | الاستوديو الذكي</title>
    
    <!-- PWA settings & Manifest -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/jpeg" href="https://files.catbox.moe/v5oblu.jpg">
    <link rel="apple-touch-icon" href="https://files.catbox.moe/v5oblu.jpg">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS & FontAwesome & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            color: #f8fafc;
        }
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .glow-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto p-4 selection:bg-purple-500 selection:text-white">

    <!-- Header فخم -->
    <header class="glass-panel p-4 rounded-3xl flex items-center justify-between mb-4">
        <div class="flex items-center gap-3">
            <div class="relative">
                <img src="https://files.catbox.moe/v5oblu.jpg" class="w-12 h-12 rounded-2xl object-cover ring-2 ring-purple-500/50 shadow-lg">
                <span class="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
            </div>
            <div>
                <h1 class="font-black text-white text-lg tracking-wide">Taiha Studio</h1>
                <p class="text-xs text-purple-400 font-medium">معالجة فورية فائقة الأمان</p>
            </div>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400">
            <i class="fa-solid fa-wand-magic-sparkles text-lg animate-pulse"></i>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col justify-center">
        <div class="glass-panel p-6 rounded-3xl space-y-5 text-center relative overflow-hidden">
            
            <!-- Upload Box State -->
            <div id="uploadContainer" class="border-2 border-dashed border-purple-500/30 hover:border-purple-500/60 rounded-2xl p-6 transition cursor-pointer bg-slate-900/40" onclick="document.getElementById('imageInput').click()">
                <div class="w-16 h-16 rounded-2xl bg-purple-500/10 text-purple-400 flex items-center justify-center text-2xl mx-auto mb-3 shadow-inner">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <h2 class="text-white font-bold text-base mb-1">اضغط لاختيار صورة</h2>
                <p class="text-xs text-slate-400">أو قم بسحب وإفلات الصورة هنا للتعديل الفوري</p>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
            </div>

            <!-- Preview & Controls Area -->
            <div id="previewArea" class="hidden space-y-4">
                <div class="relative rounded-2xl overflow-hidden border border-slate-700/60 shadow-xl bg-slate-950">
                    <img id="imagePreview" class="w-full h-56 object-contain mx-auto">
                    <button onclick="resetImage()" class="absolute top-3 left-3 bg-red-500/80 hover:bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center backdrop-blur transition">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="applyFilter('grayscale')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold py-2.5 px-3 rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-adjust text-purple-400"></i> أبيض وأسود
                    </button>
                    <button onclick="applyFilter('brightness')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold py-2.5 px-3 rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-sun text-yellow-400"></i> تفتيح وإضاءة
                    </button>
                </div>

                <button onclick="processImage()" class="w-full glow-btn text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-bolt"></i> حفظ وتنزيل المعالجة
                </button>
            </div>

            <div id="statusMessage" class="text-xs font-medium text-slate-300 hidden"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 py-3">
        <span>صُمم بكل إتقان • بلا قواعد بيانات • خصوصية كاملة 🔒</span>
    </footer>

    <!-- Service Worker & App Logic -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => console.log('PWA Ready!', reg))
                    .catch((err) => console.log('PWA Error', err));
            });
        }

        let originalImageSrc = "";

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    originalImageSrc = e.target.result;
                    document.getElementById('imagePreview').src = originalImageSrc;
                    document.getElementById('uploadContainer').classList.add('hidden');
                    document.getElementById('previewArea').classList.remove('hidden');
                    document.getElementById('statusMessage').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function resetImage() {
            document.getElementById('imageInput').value = "";
            document.getElementById('previewArea').classList.add('hidden');
            document.getElementById('uploadContainer').classList.remove('hidden');
            document.getElementById('imagePreview').style.filter = "none";
        }

        function applyFilter(type) {
            const img = document.getElementById('imagePreview');
            if (type === 'grayscale') {
                img.style.filter = img.style.filter === 'grayscale(100%)' ? 'none' : 'grayscale(100%)';
            } else if (type === 'brightness') {
                img.style.filter = img.style.filter === 'brightness(135%)' ? 'none' : 'brightness(135%)';
            }
        }

        async function processImage() {
            const status = document.getElementById('statusMessage');
            status.innerText = "✨ تتم معالجة الصورة بنجاح في متصفحك...";
            status.className = "text-xs font-bold text-purple-400 mt-2 block animate-pulse";
            status.classList.remove('hidden');

            setTimeout(() => {
                status.innerText = "🚀 جاهز! الصورة محمية ومُعالجَة بالكامل بدون تخزين.";
                status.className = "text-xs font-bold text-emerald-400 mt-2 block";
            }, 1200);
        }
    </script>
</body>
                  </html>
