<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة النور | المصحف والأذكار</title>
    
    <link rel="icon" type="image/jpeg" href="https://files.catbox.moe/v5oblu.jpg">
    <meta name="theme-color" content="#d97706">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background: #090d16; color: #f8fafc; }
        .quran-font { font-family: 'Amiri', serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(217, 119, 6, 0.2); }
        .gold-btn { background: linear-gradient(135deg, #b45309, #d97706, #fbbf24); transition: 0.3s; color: #090d16; }
        .gold-btn:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(217, 119, 6, 0.3); }
        .tab-inactive { background-color: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
        
        /* حركة خرزات السبحة */
        .bead-ring {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px dashed rgba(217, 119, 6, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto p-4 selection:bg-amber-500 selection:text-slate-950">

    <!-- Header -->
    <header class="glass-panel p-4 rounded-2xl flex items-center justify-between mb-4 shadow-xl">
        <div class="flex items-center gap-3">
            <img src="https://files.catbox.moe/v5oblu.jpg" class="w-12 h-12 rounded-xl object-cover ring-2 ring-amber-500/50 shadow-md">
            <div>
                <h1 class="font-black text-white text-base">منصة النور</h1>
                <p class="text-xs text-amber-400">المصحف، الأحاديث، والتسبيح</p>
            </div>
        </div>
        <div class="w-9 h-9 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
            <i class="fa-solid fa-kaaba"></i>
        </div>
    </header>

    <!-- Main Navigation Tabs -->
    <div class="grid grid-cols-5 gap-1 mb-4 text-center">
        <button onclick="switchTab('quran')" id="btn-quran" class="py-2 rounded-xl text-[10px] font-bold gold-btn shadow-md transition">السور</button>
        <button onclick="switchTab('audio')" id="btn-audio" class="py-2 rounded-xl text-[10px] font-bold tab-inactive transition">الاستماع</button>
        <button onclick="switchTab('tasbeeh')" id="btn-tasbeeh" class="py-2 rounded-xl text-[10px] font-bold tab-inactive transition">السبحة</button>
        <button onclick="switchTab('hadith')" id="btn-hadith" class="py-2 rounded-xl text-[10px] font-bold tab-inactive transition">الأحاديث</button>
        <button onclick="switchTab('prophets')" id="btn-prophets" class="py-2 rounded-xl text-[10px] font-bold tab-inactive transition">الأنبياء</button>
    </div>

    <!-- Content Area -->
    <main class="flex-1 flex flex-col min-h-[420px]">
        
        <!-- 1. Quran List Section -->
        <div id="tab-quran" class="glass-panel p-4 rounded-3xl space-y-3 flex-1 flex flex-col">
            <div class="relative">
                <input type="text" id="searchQuran" onkeyup="filterQuran()" placeholder="ابحث عن اسم السورة للقراءة..." class="w-full bg-slate-900/80 border border-amber-500/30 rounded-xl py-2 px-3 pl-8 text-xs text-white focus:outline-none focus:border-amber-500">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-amber-400"></i>
            </div>
            
            <div id="quranList" class="space-y-2 overflow-y-auto max-h-[340px] pr-1">
                <div class="text-center text-xs text-amber-400 py-4"><i class="fa-solid fa-spinner animate-spin ml-1"></i> جاري تحميل سور القرآن الكريم...</div>
            </div>
        </div>

        <!-- 2. Audio Player Section -->
        <div id="tab-audio" class="glass-panel p-5 rounded-3xl space-y-4 flex-1 hidden text-center">
            <h2 class="text-amber-400 font-bold text-sm border-b border-amber-500/20 pb-2 flex items-center justify-center gap-2">
                <i class="fa-solid fa-headphones"></i> الاستماع للقرآن الكريم
            </h2>
            <p class="text-xs text-slate-300">القارئ: <span class="text-amber-300 font-bold">الشيخ محمد صديق المنشاوي</span></p>

            <div class="bg-slate-900/80 p-4 rounded-2xl border border-amber-500/20 space-y-3">
                <select id="audioSurahSelect" onchange="loadAudioSurah()" class="w-full bg-slate-800 border border-slate-700 text-xs text-amber-200 rounded-xl p-2.5 focus:outline-none">
                    <option value="">اختر السورة للاستماع...</option>
                </select>
                <div class="pt-2">
                    <audio id="quranAudio" controls class="w-full h-10 rounded-lg">متصفحك لا يدعم مشغل الصوتيات.</audio>
                </div>
            </div>
        </div>

        <!-- 3. Interactive Tasbeeh Section (السبحة الممتعة) -->
        <div id="tab-tasbeeh" class="glass-panel p-5 rounded-3xl space-y-4 flex-1 hidden text-center flex flex-col justify-between items-center">
            <h2 class="text-amber-400 font-bold text-sm border-b border-amber-500/20 pb-2 w-full flex items-center justify-center gap-2">
                <i class="fa-solid fa-hands-praying"></i> السبحة الإلكترونية التفاعلية
            </h2>

            <!-- الذكر الحالي -->
            <select id="dhikrSelect" class="bg-slate-900 border border-amber-500/30 text-amber-300 text-xs rounded-xl p-2.5 w-full focus:outline-none">
                <option>سُبْحَانَ اللَّهِ وَبِحَمْدِهِ ، سُبْحَانَ اللَّهِ الْعَظِيمِ</option>
                <option>أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ وَأَتُوبُ إِلَيْهِ</option>
                <option>الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ</option>
                <option>لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ</option>
                <option>اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ</option>
            </select>

            <!-- حركة خرزات السبحة -->
            <div class="my-3 cursor-pointer" onclick="clickTasbeeh()">
                <div id="beadRing" class="bead-ring bg-slate-900/90 shadow-2xl relative">
                    <div class="text-center">
                        <span id="tasbeehCounter" class="text-3xl font-black text-amber-400 block">0</span>
                        <span class="text-[10px] text-slate-400">اضغط للتسبيح</span>
                    </div>
                </div>
            </div>

            <!-- أزرار التحكم -->
            <div class="flex gap-2 w-full">
                <button onclick="resetTasbeeh()" class="flex-1 bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 py-2 rounded-xl text-xs font-bold transition">
                    <i class="fa-solid fa-rotate-right ml-1"></i> إعادة العداد
                </button>
            </div>
        </div>

        <!-- 4. Hadith Section -->
        <div id="tab-hadith" class="glass-panel p-5 rounded-3xl space-y-3 flex-1 hidden flex flex-col">
            <h2 class="text-amber-400 font-bold text-sm border-b border-amber-500/20 pb-2 flex items-center gap-2">
                <i class="fa-solid fa-book-open"></i> الأحاديث النبوية الشريفة
            </h2>
            <div id="hadithList" class="space-y-2 overflow-y-auto max-h-[330px] pr-1">
                <div class="text-center text-xs text-amber-400 py-4"><i class="fa-solid fa-spinner animate-spin ml-1"></i> جاري تحميل الأحاديث...</div>
            </div>
        </div>

        <!-- 5. Prophets Section -->
        <div id="tab-prophets" class="glass-panel p-5 rounded-3xl space-y-3 flex-1 hidden overflow-y-auto max-h-[380px]">
            <h2 class="text-amber-400 font-bold text-sm border-b border-amber-500/20 pb-2 flex items-center gap-2">
                <i class="fa-solid fa-scroll"></i> قصص الأنبياء الكاملة
            </h2>
            <div id="prophetsList" class="space-y-2 text-right text-xs">
                <!-- سيتم تعبئتها ديناميكياً -->
            </div>
        </div>

    </main>

    <!-- Modal القراءة (المصحف / الحديث / قصة النبي) -->
    <div id="readerModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden flex-col justify-between p-4 z-50 max-w-md mx-auto">
        <div class="glass-panel p-4 rounded-2xl flex justify-between items-center border-b border-amber-500/30">
            <h3 id="modalTitle" class="font-bold text-amber-300 text-sm"></h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-xl bg-red-500/20 text-red-400 flex items-center justify-center font-bold">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div id="modalContent" class="flex-1 my-3 overflow-y-auto p-3 bg-slate-900/90 rounded-2xl border border-slate-800 text-right space-y-3">
            <!-- النص يظهر هنا -->
        </div>

        <div id="modalActions" class="p-2">
            <!-- أزرار إضافة مثل التفسير -->
        </div>
    </div>

    <footer class="text-center text-[11px] text-slate-500 py-2 mt-2">
        <span>صدقة جارية • جعلها الله في ميزان حسناتك 🌙</span>
    </footer>

    <!-- Script Logic -->
    <script>
        let surahsData = [];
        let tasbeehCount = 0;
        let beadRotation = 0;

        // قصص الأنبياء الكاملة
        const prophetsData = [
            { name: "سيدنا آدم عليه السلام", story: "خلقه الله تعالى بيده من تراب ونفخ فيه من روحه، وأسجد له الملائكة إكراماً له. علمه الله الأسماء كلها وأسكنه وزوجته حواء الجنة. حذرهما الله من الأكل من الشجرة، لكن إبليس وسوس لهما فأكلا منها. فأنزلهما الله إلى الأرض ليعمراها، فتاب آدم واستغفر ربه فتاب عليه وهداه، وكان أول الأنبياء وأبو البشرية." },
            { name: "سيدنا نوح عليه السلام", story: "أول رسل الله إلى أهل الأرض بعد أن ظهر فيهم الشرك وعبادة الأصنام. ظل يدعو قومه تسعمائة وخمسين سنة بالليل والنهار، وسراً وعلانية، فلم يؤمن معه إلا قليل. أمره الله ببناء السفينة العظيمة، وحين جاء أمر الله وفار التنور، أنزل الله طوفاناً هائلاً غرق فيه الكافرون حتى ابن نوح، ونجى الله نوحاً والمؤمنين." },
            { name: "سيدنا إبراهيم عليه السلام", story: "خليل الرحمن وإمام الحنفاء. نشأ في قوم يعبدون الكواكب والأصنام، فحطم أصنامهم بحكمته ليثبت لهم عجزها. ألقاه قومه في النار العظيمة، فأمر الله النار: 'كوني برداً وسلاماً على إبراهيم'. هاجر في سبيل الله، وابتلي بذبح ابنه إسماعيل ففداه الله بذبج عظيم، وشارك في بناء الكعبة المشرفة." },
            { name: "سيدنا موسى عليه السلام", story: "كليم الله، ولد في مصر في عهد فرعون الطاغية. ألقت أمه به في التابوت في النهر بحفظ الله ليربى في بيت فرعون نفسه. أرسله الله بآيات معجزات (العصا واليد البيضاء) ليدعو فرعون إلى التوحيد. وعندما لحقهم فرعون وجنوده، شق الله البحر لموسى وبني إسرائيل ونجاهم، وأغرق فرعون وجنوده." },
            { name: "سيدنا عيسى عليه السلام", story: "كلمة الله ورسوله، ولد من غير أب من العذراء البتول مريم عليها السلام بالمعجزة العظيمة. تكلم في المهد صبياً، وآتاه الله الإنجيل وأيده بالمعجزات كإبراء الأكمه والأبرص وإحياء الموتى بإذن الله. وعندما أراد الكفار قتله، رفعه الله إليه وشبه لهم، وسيتبع المسلمون نزوله في آخر الزمان." },
            { name: "سيدنا محمد ﷺ", story: "خاتم الأنبياء والمرسلين وسيد ولد آدم. ولد يتيماً في مكة وشُهد له بالأمانة والصدق. نزل عليه الوحي في غار حراء وهو في الأربعين بالقرآن الكريم. دعا إلى التوحيد والعدل والرحمة، وصبر على أذى قريش حتى هاجر إلى المدينة المنورة وأسس الدولة الإسلامية. أرسله الله رحمة للعالمين، وترك فينا ما إن تمسكنا به لن نضل أبداً." }
        ];

        // 1. جلب السور
        async function fetchSurahs() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                surahsData = data.data;
                renderSurahs(surahsData);
                populateAudioSelect(surahsData);
            } catch (err) {
                document.getElementById('quranList').innerHTML = '<div class="text-center text-xs text-red-400">تعذر تحميل قائمة السور.</div>';
            }
        }

        function renderSurahs(list) {
            const container = document.getElementById('quranList');
            container.innerHTML = '';
            list.forEach(s => {
                container.innerHTML += `
                    <div onclick="openSurahReader(${s.number}, '${s.name}')" class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 flex justify-between items-center hover:border-amber-500/50 transition cursor-pointer">
                        <div>
                            <span class="text-xs font-bold text-amber-300">${s.number}. سورة ${s.name}</span>
                            <span class="text-[10px] text-slate-400 block">${s.revelationType === 'Meccan' ? 'مكية' : 'مدنية'} • ${s.numberOfAyahs} آية</span>
                        </div>
                        <span class="text-xs text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/20 font-bold"><i class="fa-solid fa-book-open ml-1"></i> قراءة</span>
                    </div>
                `;
            });
        }

        // فتح المصحف لقراءة السورة
        async function openSurahReader(num, name) {
            showModal(`سورة ${name}`, '<div class="text-center text-xs text-amber-400 py-6"><i class="fa-solid fa-spinner animate-spin ml-1"></i> جاري فتح المصحف الشريف...</div>');
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${num}`);
                const data = await res.json();
                let verses = data.data.ayahs;
                
                let html = `<div class="text-center quran-font text-amber-300 text-base mb-3 border-b border-amber-500/20 pb-2">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
                html += `<div class="quran-font text-white text-lg leading-[2.4] text-justify">`;
                verses.forEach(v => {
                    html += `${v.text} <span class="text-amber-400 text-sm font-bold px-1">﴿${v.numberInSurah}﴾</span> `;
                });
                html += `</div>`;

                document.getElementById('modalContent').innerHTML = html;
                document.getElementById('modalActions').innerHTML = `
                    <button onclick="fetchTafseer(${num}, '${name}')" class="w-full gold-btn py-2.5 rounded-xl text-xs font-bold shadow-md">
                        <i class="fa-solid fa-brain ml-1"></i> عرض التفسير الميسر للسورة
                    </button>
                `;
            } catch (err) {
                document.getElementById('modalContent').innerHTML = '<div class="text-center text-xs text-red-400">حدث خطأ أثناء تحميل السورة.</div>';
            }
        }

        // جلب تفسير السورة
        async function fetchTafseer(num, name) {
            document.getElementById('modalContent').innerHTML = '<div class="text-center text-xs text-amber-400 py-6"><i class="fa-solid fa-spinner animate-spin ml-1"></i> جاري تحميل التفسير الميسر...</div>';
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${num}/ar.veryeasy`);
                const data = await res.json();
                let ayahs = data.data.ayahs;
                
                let html = `<div class="text-xs font-bold text-amber-400 mb-2">التفسير الميسر لسورة ${name}:</div>`;
                ayahs.forEach(a => {
                    html += `<div class="p-2.5 mb-2 bg-slate-800/80 rounded-xl border border-slate-700">
                        <span class="text-amber-300 font-bold text-xs block mb-1">الآية (${a.numberInSurah}):</span>
                        <p class="text-slate-200 text-xs leading-relaxed">${a.text}</p>
                    </div>`;
                });
                document.getElementById('modalContent').innerHTML = html;
            } catch (err) {
                document.getElementById('modalContent').innerHTML = '<div class="text-center text-xs text-red-400">تعذر تحميل التفسير.</div>';
            }
        }

        // 2. نظام التسبيح التفاعلي
        function clickTasbeeh() {
            tasbeehCount++;
            beadRotation += 15;
            document.getElementById('tasbeehCounter').innerText = tasbeehCount;
            document.getElementById('beadRing').style.transform = `rotate(${beadRotation}deg)`;
        }

        function resetTasbeeh() {
            tasbeehCount = 0;
            beadRotation = 0;
            document.getElementById('tasbeehCounter').innerText = "0";
            document.getElementById('beadRing').style.transform = `rotate(0deg)`;
        }

        // 3. الأحاديث النبوية
        async function fetchHadiths() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/AhmadBaseer/FortyHadithNawawi/main/FortyHadithNawawi.json');
                const data = await res.json();
                const container = document.getElementById('hadithList');
                container.innerHTML = '';
                data.slice(0, 20).forEach((h, idx) => {
                    container.innerHTML += `
                        <div onclick="openHadithModal('${h.hadith_name || 'حديث شريف'}', \`${h.hadith}\`)" class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 hover:border-amber-500/40 transition cursor-pointer flex justify-between items-center">
                            <div>
                                <h3 class="text-xs font-bold text-amber-300">الحديث ${idx + 1}: ${h.hadith_name || 'حديث شريف'}</h3>
                                <p class="text-[10px] text-slate-400 truncate max-w-[220px]">${h.hadith}</p>
                            </div>
                            <i class="fa-solid fa-chevron-left text-xs text-amber-400"></i>
                        </div>
                    `;
                });
            } catch (err) {
                document.getElementById('hadithList').innerHTML = '<div class="text-center text-xs text-red-400">تعذر تحميل الأحاديث.</div>';
            }
        }

        function openHadithModal(title, text) {
            showModal(title, `<p class="quran-font text-amber-100 text-sm leading-loose p-2">${text}</p>`);
        }

        // 4. قصص الأنبياء
        function renderProphets() {
            const container = document.getElementById('prophetsList');
            container.innerHTML = '';
            prophetsData.forEach((p) => {
                container.innerHTML += `
                    <div onclick="openProphetModal('${p.name}', \`${p.story}\`)" class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 hover:border-amber-500/40 transition cursor-pointer flex justify-between items-center">
                        <h3 class="font-bold text-amber-300 text-xs">${p.name}</h3>
                        <span class="text-[10px] text-amber-400 font-bold bg-amber-500/10 px-2 py-1 rounded-lg">اقرأ القصة كاملا <i class="fa-solid fa-book-reader ml-1"></i></span>
                    </div>
                `;
            });
        }

        function openProphetModal(title, story) {
            showModal(title, `<p class="text-slate-200 text-xs leading-relaxed p-2">${story}</p>`);
        }

        // النافذة المنبثقة الشاملة
        function showModal(title, content) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('modalActions').innerHTML = '';
            document.getElementById('readerModal').classList.remove('hidden');
            document.getElementById('readerModal').classList.add('flex');
        }

               function closeModal() {
            document.getElementById('readerModal').classList.add('hidden');
            document.getElementById('readerModal').classList.remove('flex');
        }

        // تصفية السور أثناء البحث
        function filterQuran() {
            const query = document.getElementById('searchQuran').value.trim();
            const filtered = surahsData.filter(s => s.name.includes(query) || s.englishName.toLowerCase().includes(query.toLowerCase()));
            renderSurahs(filtered);
        }

        // الاستماع للقرآن الكريم (قائمة التحديد)
        function populateAudioSelect(list) {
            const select = document.getElementById('audioSurahSelect');
            list.forEach(s => {
                let option = document.createElement('option');
                option.value = s.number;
                option.textContent = `${s.number}. سورة ${s.name}`;
                select.appendChild(option);
            });
        }

        // تشغيل صوت السورة
        function loadAudioSurah() {
            const num = document.getElementById('audioSurahSelect').value;
            if (!num) return;
            const formattedNum = String(num).padStart(3, '0');
            const audioUrl = `https://server10.mp3quran.net/minsh/${formattedNum}.mp3`;
            const audioPlayer = document.getElementById('quranAudio');
            audioPlayer.src = audioUrl;
            audioPlayer.play();
        }

        // التنقل بين الأقسام الرئيسية
        function switchTab(tab) {
            ['quran', 'audio', 'tasbeeh', 'hadith', 'prophets'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('btn-' + t).className = "py-2 rounded-xl text-[10px] font-bold tab-inactive transition";
            });
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.getElementById('btn-' + tab).className = "py-2 rounded-xl text-[10px] font-bold gold-btn shadow-md transition";
        }

        // التشغيل المبدئي للبيانات عند فتح الصفحة
        fetchSurahs();
        fetchHadiths();
        renderProphets();
    </script>
</body>
</html>
