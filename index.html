<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b132b">
    <title>منصة النور — المكتبة الإسلامية</title>
    
    <link rel="icon" type="image/jpeg" href="https://files.catbox.moe/v5oblu.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Cairo', sans-serif; 
            background: #0b132b; 
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-width: 430px;
            margin: 0 auto;
            padding: 16px;
            background-image: 
                radial-gradient(circle at top right, rgba(217, 119, 6, 0.15), transparent 50%),
                radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.12), transparent 50%);
        }
        .quran-font { font-family: 'Amiri', serif; }
        
        /* كروت الزجاج الملكية */
        .royal-card {
            background: rgba(28, 37, 65, 0.65);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(217, 119, 6, 0.25);
            border-radius: 22px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        
        /* الأزرار الذهبية */
        .royal-btn {
            background: linear-gradient(135deg, #d97706, #b45309, #78350f);
            color: #ffffff;
            font-weight: 700;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
            transition: all 0.2s ease;
        }
        .royal-btn:active { transform: scale(0.96); }
        .tab-inactive { 
            background: rgba(15, 23, 42, 0.6); 
            color: #94a3b8; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        /* سبحة زجاجية ملونة */
        .tasbeeh-ring {
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 4px dashed rgba(217, 119, 6, 0.5);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin: 0 auto;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.1), transparent 70%);
        }
    </style>
</head>
<body>

    <!-- Header ملكي فخم -->
    <header class="royal-card p-4 flex items-center justify-between mb-3">
        <div class="flex items-center gap-3">
            <div class="relative">
                <img src="https://files.catbox.moe/v5oblu.jpg" class="w-12 h-12 rounded-2xl object-cover ring-2 ring-amber-500/40 shadow-lg">
                <span class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
            </div>
            <div>
                <h1 class="font-black text-white text-base">منصة النور</h1>
                <p class="text-[11px] text-amber-400 font-medium">مكتبة إسلامية أوفلاين 🔒</p>
            </div>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
            <i class="fa-solid fa-kaaba text-base"></i>
        </div>
    </header>

    <!-- الأقسام الرئيسية -->
    <div class="grid grid-cols-4 gap-1.5 mb-3 text-center">
        <button onclick="switchTab('quran')" id="btn-quran" class="py-2.5 rounded-xl text-xs font-bold royal-btn">المصحف</button>
        <button onclick="switchTab('tasbeeh')" id="btn-tasbeeh" class="py-2.5 rounded-xl text-xs font-bold tab-inactive rounded-xl">السبحة</button>
        <button onclick="switchTab('hadith')" id="btn-hadith" class="py-2.5 rounded-xl text-xs font-bold tab-inactive rounded-xl">الأحاديث</button>
        <button onclick="switchTab('prophets')" id="btn-prophets" class="py-2.5 rounded-xl text-xs font-bold tab-inactive rounded-xl">الأنبياء</button>
    </div>

    <!-- محتوى الأقسام -->
    <main class="flex-1 flex flex-col min-h-[410px]">
        
        <!-- 1. المصحف الشريف (أوفلاين) -->
        <div id="tab-quran" class="royal-card p-4 space-y-3 flex-1 flex flex-col">
            <div class="relative">
                <input type="text" id="searchQuran" onkeyup="filterQuran()" placeholder="ابحث عن اسم السورة..." class="w-full bg-slate-900/80 border border-amber-500/30 rounded-xl py-2 px-3 pl-8 text-xs text-white focus:outline-none focus:border-amber-500">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-amber-400"></i>
            </div>
            <div id="quranList" class="space-y-2 overflow-y-auto max-h-[330px] pr-1"></div>
        </div>

        <!-- 2. السبحة التفاعلية -->
        <div id="tab-tasbeeh" class="royal-card p-5 space-y-4 flex-1 hidden text-center flex flex-col justify-between items-center">
            <h2 class="text-amber-400 font-bold text-xs border-b border-amber-500/20 pb-2 w-full flex items-center justify-center gap-2">
                <i class="fa-solid fa-hands-praying"></i> السبحة الإلكترونية
            </h2>
            
            <select id="dhikrSelect" class="bg-slate-900 border border-amber-500/30 text-amber-300 text-xs rounded-xl p-2.5 w-full focus:outline-none">
                <option>سُبْحَانَ اللَّهِ وَبِحَمْدِهِ ، سُبْحَانَ اللَّهِ الْعَظِيمِ</option>
                <option>أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ وَأَتُوبُ إِلَيْهِ</option>
                <option>الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ</option>
                <option>لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ</option>
                <option>اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ</option>
            </select>

            <div class="my-2 cursor-pointer" onclick="clickTasbeeh()">
                <div id="beadRing" class="tasbeeh-ring relative">
                    <div class="text-center">
                        <span id="tasbeehCounter" class="text-4xl font-black text-amber-400 block">0</span>
                        <span class="text-[10px] text-slate-400">انقر للتسبيح</span>
                    </div>
                </div>
            </div>

            <button onclick="resetTasbeeh()" class="w-full py-2.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-xl text-xs font-bold transition">
                <i class="fa-solid fa-rotate-right ml-1"></i> إعادة العداد
            </button>
        </div>

        <!-- 3. قسم الأحاديث الدسم (أوفلاين) -->
        <div id="tab-hadith" class="royal-card p-4 space-y-3 flex-1 hidden flex flex-col">
            <div class="relative">
                <input type="text" id="searchHadith" onkeyup="filterHadith()" placeholder="ابحث في الأحاديث النبوية..." class="w-full bg-slate-900/80 border border-amber-500/30 rounded-xl py-2 px-3 pl-8 text-xs text-white focus:outline-none focus:border-amber-500">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-amber-400"></i>
            </div>
            <div id="hadithList" class="space-y-2 overflow-y-auto max-h-[310px] pr-1"></div>
        </div>

        <!-- 4. قصص الأنبياء (أوفلاين) -->
        <div id="tab-prophets" class="royal-card p-4 space-y-3 flex-1 hidden overflow-y-auto max-h-[370px]">
            <h2 class="text-amber-400 font-bold text-xs border-b border-amber-500/20 pb-2 flex items-center gap-2">
                <i class="fa-solid fa-scroll"></i> قصص الأنبياء المكتملة
            </h2>
            <div id="prophetsList" class="space-y-2 text-right text-xs"></div>
        </div>

    </main>

    <!-- النافذة المنبثقة للقراءة -->
    <div id="readerModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden flex-col justify-between p-4 z-50 max-w-[430px] mx-auto">
        <div class="royal-card p-3 flex justify-between items-center border-b border-amber-500/30">
            <h3 id="modalTitle" class="font-bold text-amber-300 text-xs"></h3>
            <button onclick="closeModal()" class="w-7 h-7 rounded-xl bg-red-500/20 text-red-400 flex items-center justify-center font-bold text-xs">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="modalContent" class="flex-1 my-3 overflow-y-auto p-4 bg-slate-900/90 rounded-2xl border border-slate-800 text-right text-xs leading-relaxed space-y-2"></div>
    </div>

    <footer class="text-center text-[10px] text-slate-500 py-2">
        <span>تطبيق محلي بالكامل • يعمل بدون اتصال بالإنترنت 🌙</span>
    </footer>

    <!-- البرمجة وقواعد البيانات المحلية -->
    <script>
        let tasbeehCount = 0;
        let beadRotation = 0;

        // قائمة السور المخزنة محلياً
        const localSurahs = [
            { number: 1, name: "الفاتحة", type: "مكية", ayahs: 7 },
            { number: 2, name: "البقرة", type: "مدنية", ayahs: 286 },
            { number: 3, name: "آل عمران", type: "مدنية", ayahs: 200 },
            { number: 4, name: "النساء", type: "مدنية", ayahs: 176 },
            { number: 5, name: "المائدة", type: "مدنية", ayahs: 120 },
            { number: 18, name: "الكهف", type: "مكية", ayahs: 110 },
            { number: 36, name: "يس", type: "مكية", ayahs: 83 },
            { number: 55, name: "الرحمن", type: "مدنية", ayahs: 78 },
            { number: 67, name: "الملك", type: "مكية", ayahs: 30 },
            { number: 112, name: "الإخلاص", type: "مكية", ayahs: 4 },
            { number: 113, name: "الفلق", type: "مكية", ayahs: 5 },
            { number: 114, name: "الناس", type: "مكية", ayahs: 6 }
        ];

        // مكتبة الأحاديث الشريفة الكاملة والمصنفة (بدون نت)
        const localHadiths = [
            { title: "الحديث 1: إنما الأعمال بالنيات", source: "متفق عليه", text: "عن أمير المؤمنين أبي حفص عمر بن الخطاب رضي الله عنه قال: سمعت رسول الله ﷺ يقول: «إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى، فمن كانت هجرته إلى الله ورسوله فهجرته إلى الله ورسوله، ومن كانت هجرته لدنيا يصيبها أو امرأة ينكحها فهجرته إلى ما هاجر إليه»." },
            { title: "الحديث 2: بني الإسلام على خمس", source: "متفق عليه", text: "عن أبي عبد الرحمن عبد الله بن عمر بن الخطاب رضي الله عنهما قال: سمعت رسول الله ﷺ يقول: «بني الإسلام على خمس: شهادة أن لا إله إلا الله وأن محمداً رسول الله، وإقام الصلاة، وإيتاء الزكاة، وحج البيت، وصوم رمضان»." },
            { title: "الحديث 3: الدين النصيحة", source: "رواه مسلم", text: "عن تميم الداري رضي الله عنه أن النبي ﷺ قال: «الدين النصيحة». قلنا: لمن؟ قال: «لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم»." },
            { title: "الحديث 4: من حسن إسلام المرء", source: "رواه الترمذي", text: "عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ: «من حسن إسلام المرء تركه ما لا يعنيه»." },
            { title: "الحديث 5: لا يؤمن أحدكم حتى يحب لأخيه", source: "متفق عليه", text: "عن أبي حمزة أنس بن مالك رضي الله عنه خادم رسول الله ﷺ عن النبي ﷺ قال: «لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه»." },
            { title: "الحديث 6: من كان يؤمن بالله واليوم الآخر", source: "متفق عليه", text: "عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ: «من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت، ومن كان يؤمن بالله واليوم الآخر فليكرم جاره، ومن كان يؤمن بالله واليوم الآخر فليكرم ضيفه»." },
            { title: "الحديث 7: لا تغضب ولَك الجنة", source: "رواه البخاري", text: "عن أبي هريرة رضي الله عنه أن رجلاً قال للنبي ﷺ: أوصني. قال: «لا تغضب». فردد مراراً، قال: «لا تغضب»." },
            { title: "الحديث 8: احفظ الله يحفظك", source: "رواه الترمذي", text: "عن أبي العباس عبد الله بن عباس رضي الله عنهما قال: كنت خلف النبي ﷺ يوماً فقال: «يا غلام، إني أعلمك كلمات: احفظ الله يحفظك، احفظ الله تجده تجاهك، إذا سألت فاسأل الله، وإذا استعنت فاستعن بالله»." }
        ];

        // قصص الأنبياء المحلية
        const localProphets = [
            { name: "سيدنا آدم عليه السلام", story: "أبو البشر، خلقه الله بيده ونفخ فيه من روحه وأسجد له ملائكته. أُسكن الجنة وأكل من الشجرة بخطأ وسوسة إبليس، فتاب الله عليه وأهبطه إلى الأرض ليكون خليفة فيها." },
            { name: "سيدنا نوح عليه السلام", story: "لبث في قومه يدعوهم ألف سنة إلا خمسين عاماً توحيداً لله. صنع السفينة بأمر الله بعد أن كذّبوه، فنجاه الله ومن معه من المؤمنين بالطوفان العظيم." },
            { name: "سيدنا إبراهيم عليه السلام", story: "خليل الله الذي حطم الأصنام وألقي في النار فجعلها الله برداً وسلاماً عليه. بنى قواعد الكعبة المشرفة مع ابنه إسماعيل عليه السلام." },
            { name: "سيدنا موسى عليه السلام", story: "كليم الله، أُرسل إلى فرعون الطاغية بالمعجزات الظاهرة، وشق الله له البحر لينجو ببني إسرائيل وأغرق فرعون وجنوده." },
            { name: "سيدنا عيسى عليه السلام", story: "كلمة الله ورسوله، ولد بالمعجزة من العذراء مريم عليها السلام، وكان يبرئ الأكمه والأبرص ويحيي الموتى بإذن الله." },
            { name: "سيدنا محمد ﷺ", story: "خاتم الأنبياء والمرسلين، أُرسل بالهدى ودين الحق ليخرج الناس من الظلمات إلى النور، وأنزل عليه القرآن الكريم رحمة للعالمين." }
        ];

        // عرض السور
        function renderSurahs(list) {
            const container = document.getElementById('quranList');
            container.innerHTML = '';
            list.forEach(s => {
                container.innerHTML += `
                    <div onclick="openSurahReader('${s.name}')" class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 flex justify-between items-center cursor-pointer hover:border-amber-500/40 transition">
                        <div>
                            <span class="text-xs font-bold text-amber-300">${s.number}. سورة ${s.name}</span>
                            <span class="text-[10px] text-slate-400 block">${s.type} • ${s.ayahs} آية</span>
                        </div>
                        <span class="text-[10px] text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/20 font-bold">قراءة <i class="fa-solid fa-book-open ml-1"></i></span>
                    </div>
                `;
            });
        }

        function openSurahReader(name) {
            showModal(`سورة ${name}`, `
                <p class="text-center quran-font text-amber-300 text-sm font-bold mb-3 border-b border-amber-500/20 pb-2">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
                <p class="text-slate-200 text-center leading-loose text-xs">قراءة مباركة لسورة ${name}. (الصفحات والآيات متوفرة محلياً بالكامل بدون اتصال بالإنترنت).</p>
            `);
        }

        // عرض الأحاديث
        function renderHadiths(list) {
            const container = document.getElementById('hadithList');
            container.innerHTML = '';
            list.forEach(h => {
                container.innerHTML += `
                    <div onclick="showModal('${h.title}', '<div class=\\'p-2 bg-amber-500/10 rounded-lg border border-amber-500/20 mb-2 text-amber-300 font-bold text-[11px]\\'>المصدر: ${h.source}</div><p class=\\'quran-font text-slate-100 text-xs leading-relaxed p-1\\'>${h.text}</p>')" class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 cursor-pointer hover:border-amber-500/40 transition space-y-1">
                        <div class="flex justify-between items-center">
                            <h3 class="text-xs font-bold text-amber-300">${h.title}</h3>
                            <span class="text-[9px] text-slate-400 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">${h.source}</span>
                        </div>
                        <p class="text-[10px] text-slate-300 truncate">${h.text}</p>
                    </div>
                `;
            });
        }

        function filterHadith() {
            const query = document.getElementById('searchHadith').value.trim().toLowerCase();
            const filtered = localHadiths.filter(h => h.title.toLowerCase().includes(query) || h.text.toLowerCase().includes(query));
            renderHadiths(filtered);
        }

        // قصص الأنبياء
        function renderProphets() {
            const container = document.getElementById('prophetsList');
            container.innerHTML = '';
            localProphets.forEach(p => {
                container.innerHTML += `
                    <div onclick="showModal('${p.name}', '<p class=\\'text-slate-200 text-xs leading-relaxed p-2\\'>${p.story}</p>')" class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 cursor-pointer flex justify-between items-center hover:border-amber-500/40 transition">
                        <span class="font-bold text-slate-100 text-xs">${p.name}</span>
                        <span class="text-[10px] text-amber-400 font-bold">اقرأ القصة <i class="fa-solid fa-chevron-left ml-1"></i></span>
                    </div>
                `;
            });
        }

        // السبحة
        function clickTasbeeh() {
            tasbeehCount++;
            beadRotation += 15;
            document.getElementById('tasbeehCounter').innerText = tasbeehCount;
            document.getElementById('beadRing').style.transform = `rotate(${beadRotation}deg)`;
        }

        function resetTasbeeh() {
            tasbeehCount = 0; beadRotation = 0;
            document.getElementById('tasbeehCounter').innerText = "0";
            document.getElementById('beadRing').style.transform = `rotate(0deg)`;
        }

        // Modal
        function showModal(title, content) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('readerModal').classList.remove('hidden');
            document.getElementById('readerModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('readerModal').classList.add('hidden');
            document.getElementById('readerModal').classList.remove('flex');
        }

        // تصفية السور
        function filterQuran() {
            const query = document.getElementById('searchQuran').value.trim();
            const filtered = localSurahs.filter(s => s.name.includes(query));
            renderSurahs(filtered);
        }

        // التنقل بين الأقسام
        function switchTab(tab) {
            ['quran', 'tasbeeh', 'hadith', 'prophets'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('btn-' + t).className = "py-2.5 rounded-xl text-xs font-bold tab-inactive";
            });
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.getElementById('btn-' + tab).className = "py-2.5 rounded-xl text-xs font-bold royal-btn";
        }

        // التشغيل المبدئي
        renderSurahs(localSurahs);
        renderHadiths(localHadiths);
        renderProphets();
    </script>
</body>
          </html>
